<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>RepCam</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RepCam">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1B2330">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://storage.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ECEEE9;--card:#FFFFFF;--line:#D5D9D2;--txt:#1B2330;--mut:#5F6A78;
    --acc:#1B2330;--on-acc:#FFFFFF;--btn:#DDE1DA;--field:#F4F5F2;--red:#E0392E;--warn:#8A4B00;
    --disp:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
    --body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:16px/1.45 var(--body)}
  .view{display:none;min-height:100%;padding:calc(18px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
  .view.on{display:block}
  h1{font:700 34px/1 var(--disp);margin:0 0 4px;letter-spacing:.2px}
  h2{font:600 22px/1.1 var(--disp);margin:30px 0 10px}
  p.sub{color:var(--mut);margin:0 0 10px;font-size:15px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
  .row{display:flex;gap:8px;align-items:center}
  .row>*{min-width:0}
  .grow{flex:1}
  input,select{background:var(--field);color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:9px 8px;font-size:16px;width:100%}
  button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:14px 16px;background:var(--btn);color:var(--txt);cursor:pointer}
  button.pri{background:var(--acc);color:var(--on-acc)}
  button.red{background:var(--red);color:#fff}
  button.big{width:100%;font-size:19px;padding:17px}
  button.sm{padding:8px 11px;border-radius:9px;font-size:14px}
  button:disabled{opacity:.4;cursor:default}
  :focus-visible{outline:3px solid #3B6FE0;outline-offset:2px}
  .exname{font:600 21px/1.15 var(--disp)}
  .warn{color:var(--warn);font-size:14px}
  a{color:inherit;font-weight:600}

  /* ---- home ---- */
  #home{padding-bottom:calc(128px + env(safe-area-inset-bottom))}
  .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:22px}
  .brand{font:700 26px/1 var(--disp);letter-spacing:.3px}
  .week{font-size:14px;color:var(--mut)}
  .calhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
  #month{font:600 20px/1.2 var(--disp)}
  .linkbtn{background:none;padding:4px 0;font-size:14px;text-decoration:underline;text-underline-offset:3px;border-radius:4px}
  .days{display:flex;gap:6px;overflow-x:auto;margin:0 -18px 22px;padding:2px 18px 6px;scrollbar-width:none}
  .days::-webkit-scrollbar{display:none}
  .day{flex:1 0 44px;min-width:0;padding:7px 2px 8px;text-align:center;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:400}
  .day small{display:block;font:400 11px/1.3 var(--body);color:var(--mut)}
  .day b{display:block;font:700 23px/1.1 var(--disp)}
  .day span{display:block;font:600 12px/1.2 var(--body);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .day.off{background:none}
  .day.off span{font-weight:400;color:var(--mut)}
  .day.today{border-color:var(--txt)}
  .day.sel{background:var(--txt);border-color:var(--txt);color:#fff}
  .day.sel small,.day.sel.off span{color:#B9C0CB}
  .srow{display:flex;align-items:center;gap:6px;margin-bottom:8px}
  .srow .num{width:30px;height:30px;font-size:16px}
  .srow select{flex:1}
  .srow button{flex:none;width:40px;padding:9px 0}
  .hday{display:block;font:600 17px/1.2 var(--disp);color:var(--txt)}
  .today h1{font-size:44px}
  #planMeta{font-size:16px;color:var(--mut);margin:0 0 18px}
  #plan{list-style:none;margin:0;padding:0;position:relative}
  #plan::before{content:"";position:absolute;left:17px;top:22px;bottom:22px;width:2px;background:var(--line)}
  .ex{position:relative;margin-bottom:8px}
  .exhead{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;padding:6px 0;border-radius:12px;font-weight:400}
  .num{flex:none;width:36px;height:36px;border-radius:50%;background:var(--txt);color:var(--bg);display:grid;place-items:center;font:700 19px/1 var(--disp);position:relative}
  .exbody{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 14px;display:flex;align-items:center;gap:10px}
  .ex.open .exbody{border-color:var(--txt);border-bottom-left-radius:0;border-bottom-right-radius:0}
  .exmain{flex:1;min-width:0}
  .exsub{display:block;font-size:14px;color:var(--mut);margin-top:1px}
  .chev{flex:none;width:9px;height:9px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:rotate(45deg);margin:0 4px 4px 0;transition:transform .15s}
  .ex.open .chev{transform:rotate(-135deg);margin-bottom:-4px}
  .ex.open .exhead{padding-bottom:0}
  .ex.open .exbody{border-bottom-color:var(--line)}
  .exedit{margin-left:48px;background:var(--card);border:1px solid var(--txt);border-top:0;border-radius:0 0 14px 14px;padding:4px 14px 12px}
  .stp{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
  .stl{font-size:15px}
  .stc{display:flex;align-items:center;gap:4px}
  .stc button{width:44px;height:44px;padding:0;border-radius:50%;font-size:22px;line-height:1;background:var(--field);border:1px solid var(--line)}
  .stc output{min-width:74px;text-align:center;font:600 22px/1 var(--disp)}
  .exacts{display:flex;gap:8px;margin-top:12px}
  .exacts button{flex:1;padding:11px 4px;font-size:14px;border-radius:10px;white-space:nowrap}
  .exacts .del{color:var(--red);background:none;border:1px solid var(--line)}
  .addrow{display:flex;align-items:center;gap:12px;width:100%;background:none;padding:6px 0;text-align:left;font-weight:600;position:relative}
  .addrow .num{background:var(--bg);color:var(--txt);border:2px dashed var(--mut);font-size:22px}
  .empty{margin-left:48px;color:var(--mut);padding:6px 0 12px}
  details.set{margin-top:26px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 14px}
  details.set summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:14px 0;font-weight:600;cursor:pointer}
  details.set summary::-webkit-details-marker{display:none}
  details.set[open] .chev{transform:rotate(-135deg);margin-bottom:-4px}
  details.set .stp:last-child{border-bottom:0}
  .hint{font-size:13px;color:var(--mut);display:block}
  .hrow{display:flex;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
  .hdate{flex:none;width:58px;font:600 17px/1.2 var(--disp)}
  .hdate small{display:block;font:400 13px var(--body);color:var(--mut)}
  .hlines{font-size:14px;color:var(--mut)} .hlines b{color:var(--txt);font-weight:600}
  .cta{position:fixed;left:0;right:0;bottom:0;padding:26px 18px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(rgba(236,238,233,0),var(--bg) 34%)}
  .cta>div{max-width:524px;margin:0 auto}
  #startBtn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:18px;border-radius:16px;background:var(--txt);color:#fff;font:600 24px/1 var(--disp);letter-spacing:.3px}
  #startBtn i{width:16px;height:16px;border-radius:50%;background:var(--red);box-shadow:0 0 0 4px rgba(224,57,46,.28)}
  #homeMsg{margin:0 0 8px;text-align:center}
  #homeMsg:empty{display:none}
  .sheet{position:fixed;inset:0;z-index:5;background:rgba(27,35,48,.45);display:flex;align-items:flex-end}
  .sheet[hidden]{display:none}
  .sheet>div{background:var(--bg);width:100%;max-width:560px;margin:0 auto;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:80vh;overflow:auto;animation:up .18s ease-out}
  @keyframes up{from{transform:translateY(30px);opacity:0}}
  .sheet h2{margin:0 0 12px}
  .pick{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);margin-bottom:8px;padding:13px 14px}
  .pick span{font-size:13px;color:var(--mut);font-weight:400}
  .pick b{font:600 20px/1.1 var(--disp)}

  /* ---- session (over the camera, always dark) ---- */
  #session{--card:#181c22;--line:#2a303a;--txt:#f2f4f7;--mut:#aab2be;--acc:#FFD23F;--on-acc:#1a1a1a;--btn:#262c36;--field:#0f1216;--warn:#ffcf5c;
    --bg:#14181e;color:var(--txt);padding:0;max-width:none;position:fixed;inset:0;background:#000}
  #session[data-phase="rec"] #quitBtn,#session[data-phase="cd"] #quitBtn,#session[data-phase="rec"] #flipBtn,#session[data-phase="cd"] #flipBtn{display:none}
  #stage{position:absolute;inset:0;overflow:hidden}
  #stage.mirror video,#stage.mirror canvas{transform:scaleX(-1)}
  #cam,#overlay{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  #hud{position:absolute;top:0;left:0;right:0;padding:calc(12px + env(safe-area-inset-top)) 14px 30px;display:flex;justify-content:space-between;align-items:flex-start;background:linear-gradient(#000b,#0000)}
  #hud .t{font:700 26px/1.1 var(--disp)} #hud .s{font-size:14px;color:#d5dae2}
  #recdot{display:none;align-items:center;gap:6px;font-weight:700;font-size:13px;color:#fff;margin-top:4px}
  #recdot i{width:10px;height:10px;border-radius:50%;background:var(--red);animation:bl 1s infinite}
  @keyframes bl{50%{opacity:.2}}
  #big{position:absolute;left:0;right:0;top:50%;transform:translateY(-60%);text-align:center;font:700 46vmin/1 var(--disp);color:#fff;text-shadow:0 4px 30px #000c;pointer-events:none}
  #big small{display:block;font:600 6vmin var(--disp);letter-spacing:2px;color:var(--acc)}
  #hud button{white-space:nowrap;flex:none}
  #big .note{display:block;width:fit-content;margin:2.5vmin auto 0;padding:1.2vmin 3.2vmin;border-radius:99px;background:#000a;color:#fff;font:600 4.6vmin/1.2 var(--body);letter-spacing:0;text-shadow:none}
  #big .note.beat{background:var(--acc);color:var(--on-acc)}
  .lastbox{display:flex;justify-content:space-between;align-items:baseline;background:#0f1216e6;border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px;font-size:14px;color:var(--mut)}
  .lastbox b{font:600 24px/1 var(--disp);color:var(--acc)}
  #verdict{margin:10px 2px 0;font-size:15px;font-weight:600;min-height:22px}
  #verdict.up{color:var(--acc)}
  .exlast{display:block;font-size:13px;color:var(--mut);margin-top:2px}
  #panel{position:absolute;left:0;right:0;bottom:0;padding:40px 14px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(#0000,#000d 40%)}
  #status{font-size:14px;color:#d5dae2;margin-bottom:8px;min-height:18px}
  .step{display:flex;align-items:center;gap:8px;background:#0f1216e6;border:1px solid var(--line);border-radius:12px;padding:6px}
  .step b{flex:1;text-align:center;font:600 26px/1 var(--disp)}
  .step button{width:52px;padding:10px 0;font-size:22px}
  .lbl{font-size:13px;color:var(--mut);margin:8px 0 4px}

  /* ---- summary ---- */
  .seg{display:flex;gap:4px;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:4px;margin:6px 0}
  .seg button{flex:1;padding:9px 6px;border-radius:9px;background:none;font-size:15px}
  .seg button.on{background:var(--txt);color:#fff}
  #reelOpts .stp:last-of-type{border-bottom:0}
  table{width:100%;border-collapse:collapse;font-size:15px} td{padding:7px 4px;border-top:1px solid var(--line)}
  td.r{text-align:right}
  #reelOut video{width:100%;border-radius:12px;margin-top:10px;background:#000}

  /* ---- opening screen: the icon on a dark field until the app is ready ---- */
  #splash{position:fixed;inset:0;z-index:50;background:#1B2330;display:grid;place-items:center;transition:opacity .45s ease}
  #splash svg{width:36vmin;max-width:200px;animation:splashin .55s cubic-bezier(.2,.8,.3,1) both;transition:transform .45s ease}
  #splash.out{opacity:0;pointer-events:none}
  #splash.out svg{transform:scale(1.1)}
  @keyframes splashin{from{opacity:0;transform:scale(.86)}}
  /* ---- motion: short, and only in answer to a tap (plus one slow pulse on the record dot) ---- */
  button{transition:transform .12s ease-out,filter .12s ease-out,background-color .15s,border-color .15s;touch-action:manipulation}
  button:active:not(:disabled){transform:scale(.95);filter:brightness(.92)}
  .exhead:active:not(:disabled),.addrow:active:not(:disabled){transform:scale(.985);filter:none}
  #startBtn:active:not(:disabled),button.big:active:not(:disabled){transform:scale(.975)}
  .view.on{animation:viewin .22s ease-out}
  @keyframes viewin{from{opacity:0}}
  .sheet{animation:viewin .18s ease-out}
  .swap{animation:swap .22s ease-out}
  @keyframes swap{from{opacity:0;transform:translateY(8px)}}
  .exedit.anim{overflow:hidden;animation:openrow .24s ease-out}
  @keyframes openrow{from{max-height:0;opacity:0;padding-bottom:0}to{max-height:280px;opacity:1}}
  .stc output.tick{animation:tick .22s ease-out}
  @keyframes tick{from{transform:scale(1.22)}}
  #big.pop{animation:pop .26s cubic-bezier(.2,.9,.3,1.2)}
  @keyframes pop{from{transform:translateY(-60%) scale(1.22);opacity:.6}to{transform:translateY(-60%) scale(1)}}
  #startBtn i{animation:dot 2.6s ease-in-out infinite}
  @keyframes dot{50%{box-shadow:0 0 0 8px rgba(224,57,46,.12)}}
  #startBtn:disabled i{animation:none}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="splash" aria-hidden="true"><svg viewBox="0 0 100 100" fill="none">
  <g stroke="#FFD23F" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><path d="M35 20H20V35"/><path d="M65 20H80V35"/><path d="M35 80H20V65"/><path d="M65 80H80V65"/></g>
  <g fill="#ECEEE9"><rect x="25.5" y="47" width="49" height="6" rx="3"/><rect x="31.6" y="34.9" width="8" height="30.2" rx="3.3"/><rect x="60.4" y="34.9" width="8" height="30.2" rx="3.3"/><rect x="24.7" y="39.9" width="6" height="20.2" rx="2.6"/><rect x="69.3" y="39.9" width="6" height="20.2" rx="2.6"/></g>
</svg></div>

<!-- HOME -->
<div id="home" class="view on">
  <div class="top"><div class="brand">RepCam</div><div class="week" id="week"></div></div>
  <div class="calhead"><span id="month"></span><button class="linkbtn" data-split="open">Edit split</button></div>
  <div class="days" id="days"></div>

  <section class="today">
    <h1 id="dayTitle"></h1>
    <p id="planMeta"></p>
    <ol id="plan"></ol>
    <button class="addrow" id="addBtn"><span class="num">+</span>Add exercise</button>
  </section>

  <details class="set">
    <summary>Recording settings<span class="chev"></span></summary>
    <div id="settings"></div>
  </details>

  <h2>Recent workouts</h2>
  <div id="history"></div>
  <p class="sub" id="ver" style="margin-top:26px;font-size:13px"></p>

  <div class="cta"><div>
    <p id="homeMsg" class="warn" role="alert"></p>
    <button id="startBtn"></button>
  </div></div>

  <div class="sheet" id="sheet" hidden><div role="dialog" aria-label="Add exercise">
    <h2>Add exercise</h2>
    <div id="picks"></div>
    <button class="big" id="sheetClose">Cancel</button>
  </div></div>

  <div class="sheet" id="splitSheet" hidden><div role="dialog" aria-label="Edit split">
    <h2>Your split</h2>
    <div id="splitRows"></div>
    <button class="addrow" data-split="add"><span class="num">+</span>Add day</button>
    <h2 style="margin-top:22px">Workouts</h2>
    <div id="wkRows"></div>
    <div class="row" style="margin-bottom:16px"><input id="newWk" placeholder="New workout name" aria-label="New workout name"><button class="sm" data-split="newwk" style="flex:none">Add</button></div>
    <button class="pri big" id="splitDone">Done</button>
  </div></div>
</div>

<!-- SESSION -->
<div id="session" class="view">
  <div id="stage" class="mirror">
    <video id="cam" playsinline muted autoplay></video>
    <canvas id="overlay"></canvas>
  </div>
  <div id="hud">
    <div><div class="t" id="hudEx"></div><div class="s" id="hudSet"></div><div id="recdot"><i></i>REC</div></div>
    <div class="row"><button id="flipBtn" class="sm">Flip</button><button id="quitBtn" class="sm">End workout</button></div>
  </div>
  <div id="big"></div>
  <div id="panel"><div id="status"></div><div id="panelBody"></div></div>
  <div class="sheet" id="quitSheet" hidden><div role="dialog" aria-label="End workout">
    <h2>End workout now?</h2>
    <p class="sub" id="quitMsg"></p>
    <div class="row"><button class="big" id="quitNo" style="flex:1">Keep going</button><button class="red big" id="quitYes" style="flex:1">End workout</button></div>
  </div></div>
</div>

<!-- SUMMARY -->
<div id="summary" class="view">
  <h1 id="sumTitle">Workout done</h1>
  <p class="sub" id="sumSub"></p>
  <div id="sumBody"></div>
  <h2>Highlight reel</h2>
  <div class="card" id="reelOpts"></div>
  <button id="reelBtn" class="pri big">Build highlight reel</button>
  <div id="reelOut"></div>
  <button id="homeBtn" class="big" style="margin-top:22px">Back to home</button>
  <p class="sub" style="margin-top:12px">Download clips before closing this page.</p>
</div>

<script>
/*<core>*/
// lo/hi are the two ends of the movement. joint = angle in degrees, gap = distance as % of shoulder or hip width.
const LIB = {
  // chest, shoulders, triceps
  bench:       {name:'Bench press',               joint:'elbow',    lo:100, hi:150, rest:180, w:50},
  inclinesmith:{name:'Incline Smith press',       joint:'elbow',    lo:100, hi:150, rest:180, w:40},
  pecdeck:     {name:'Pec deck',                  gap:'wrists',     lo:80,  hi:150, rest:90,  w:40},
  ohp:         {name:'Overhead press',            joint:'elbow',    lo:100, hi:150, rest:150, w:30},
  pike:        {name:'Pike push-up',              joint:'elbow',    lo:100, hi:150, rest:120, w:0},
  pushup:      {name:'Push-up',                   joint:'elbow',    lo:100, hi:150, rest:90,  w:0},
  dips:        {name:'Weighted dip',              joint:'elbow',    lo:100, hi:150, rest:150, w:0},
  lateral:     {name:'Lateral raise',             joint:'shoulder', lo:35,  hi:65,  rest:90,  w:7.5},
  ohtri:       {name:'Overhead cable triceps extension', joint:'elbow', lo:80, hi:145, rest:90, w:20},
  pushdown1:   {name:'Single-arm triceps pushdown', joint:'elbow',  lo:80,  hi:145, rest:60,  w:10},
  // back, biceps
  pullup:      {name:'Weighted pull-up',          joint:'elbow',    lo:90,  hi:150, rest:180, w:0},
  chinup:      {name:'Chin-up',                   joint:'elbow',    lo:90,  hi:150, rest:150, w:0},
  csrow:       {name:'Chest-supported row',       joint:'elbow',    lo:100, hi:150, rest:120, w:40},
  row:         {name:'Bent-over row',             joint:'elbow',    lo:100, hi:150, rest:120, w:40},
  reardelt:    {name:'Rear delt fly',             gap:'wrists',     lo:80,  hi:150, rest:90,  w:10},
  curl:        {name:'Biceps curl',               joint:'elbow',    lo:70,  hi:140, rest:90,  w:12.5},
  preacher:    {name:'Preacher curl',             joint:'elbow',    lo:70,  hi:135, rest:90,  w:20},
  inclinecurl: {name:'Incline curl',              joint:'elbow',    lo:70,  hi:140, rest:90,  w:10},
  // legs, core
  squat:       {name:'Squat',                     joint:'knee',     lo:110, hi:155, rest:180, w:60},
  deadlift:    {name:'Deadlift',                  joint:'hip',      lo:125, hi:160, rest:180, w:80},
  legcurl:     {name:'Leg curl',                  joint:'knee',     lo:100, hi:145, rest:90,  w:35},
  legext:      {name:'Leg extension',             joint:'knee',     lo:100, hi:150, rest:90,  w:40},
  hipmachine:  {name:'Hip adduction / abduction', gap:'knees',      lo:150, hi:220, rest:90,  w:40},
  abcrunch:    {name:'Cable ab crunch',           joint:'hip',      lo:105, hi:130, rest:60,  w:30},

function angleAt(a,b,c){
  const v1x=a.x-b.x, v1y=a.y-b.y, v2x=c.x-b.x, v2y=c.y-b.y;
  const d=Math.hypot(v1x,v1y)*Math.hypot(v2x,v2y);

class RepCounter{

class SetTracker{

    if(this.def.gap){const v=gapValue(lm,GAPS[this.def.gap],aspect); if(v!=null) this.c[0].update(v,t);}
    else JOINTS[this.def.joint].forEach((tri,i)=>{const a=sideAngle(lm,tri,aspect); if(a!=null) this.c[i].update(a,t);});

  get reps(){return this.c.reduce((a,b)=>b.reps.length>a.reps.length?b:a).reps;}
  idleFor(t){const v=this.c.filter(c=>c.lastMoveT!=null).map(c=>c.idleFor(t));return v.length?Math.min(...v):0;}

// Parts of a set clip that go into the reel, as {a,b} in seconds.
// opt.mode 'reps': the first opt.first reps and the last opt.last reps.
// opt.mode 'secs': the first opt.secFirst seconds and the last opt.secLast seconds of the lifting itself.
function reelSegments(set,opt){
  const reps=set.reps||[], n=reps.length, dur=set.dur||(n?reps[n-1].end+0.6:6);
  // where the lifting starts and ends, so walking to and from the phone is left out
  const t0=n?Math.max(0,reps[0].start-0.6):0, t1=n?Math.min(dur,reps[n-1].end+0.6):dur;
  let segs=[];
  if(opt.mode==='secs'||!n){
    const f=opt.mode==='secs'?opt.secFirst:6, l=opt.mode==='secs'?opt.secLast:0, len=t1-t0;
    const ff=Math.min(f,len), ll=Math.min(l,len-ff);

    const f=Math.min(opt.first,n), l=Math.min(opt.last,n-f);

    if(l>0) segs.push({a:Math.max(0,reps[n-l].start-0.6),b:t1});

}

  octx.lineWidth=Math.max(3,w/200); octx.strokeStyle='#ffffffaa';
  for(const [a,b] of BONES){const p=lm[a],q=lm[b];if((p.visibility??1)<.5||(q.visibility??1)<.5)continue;
    octx.beginPath();octx.moveTo(p.x*w,p.y*h);octx.lineTo(q.x*w,q.y*h);octx.stroke();}
  octx.strokeStyle='#FFD23F';octx.lineWidth=Math.max(5,w/120);
  for(const tri of tris||[]){octx.beginPath();
    tri.forEach((i,k)=>{const p=lm[i];k?octx.lineTo(p.x*w,p.y*h):octx.moveTo(p.x*w,p.y*h)});octx.stroke();}
}
function loop(){
  if(!loopOn) return;
  requestAnimationFrame(loop);
  const now=performance.now();
  if(!cam.videoWidth) return;
  if(overlay.width!==cam.videoWidth){overlay.width=cam.videoWidth;overlay.height=cam.videoHeight;}
  if(poseReady&&cam.currentTime!==lastVT&&now-lastDetect>60){
    lastVT=cam.currentTime; lastDetect=now;
    let res=null; try{res=landmarker.detectForVideo(cam,now);}catch(e){}
    octx.clearRect(0,0,overlay.width,overlay.height);
    const lm=res&&res.landmarks&&res.landmarks[0];
    bodySeen=!!lm;
    if(lm){
      const ex=curEx(), asp=overlay.width/overlay.height; let tris=[];
      if(ex&&phase==='rec'){
        const r=counter.update(lm,asp,(now-recT0)/1000); tris=r.tris;
        if(r.counted){showReps(counter.reps.length);beep(1040,70);}
      }else if(ex) tris=visibleParts(lm,LIB[ex.key]);
      drawPose(lm,tris);
    }
  }
  if(phase==='rec'){
    const t=(now-recT0)/1000;
    if(settings.idle>0&&counter.reps.length>0&&counter.idleFor(t)>settings.idle) endSet(true);
  }
  if(phase==='ready'&&poseReady) setStatus(bodySeen?'':'Step back so your whole body is in frame.');
}

/* ---------- SESSION ---------- */
let sess=null, phase='idle', counter=null, recorder=null, chunks=[], recT0=0, timer=null, wake=null;
const curEx=()=>sess&&sess.plan[sess.ei];
function setStatus(s){$('status').textContent=s;}
// Most recent logged workout that included this exercise (history is newest first)
function lastSets(key){
  const name=LIB[key].name;
  for(const s of store.get('rc_history',[])){const e=s.ex.find(e=>e.key?e.key===key:e.name===name); if(e) return e.sets;}
  return null;
}
function repNote(n){
  const L=sess&&sess.last, ex=curEx(); if(!L||!ex) return null;
  if(L.w!==ex.weight) return {t:`Last time ${fmtW(L.w)} × ${L.r}`};
  if(n<L.r) return {t:`${L.r} last time`};
  return n===L.r?{t:'Matched last time',beat:true}:{t:`+${n-L.r} on last time`,beat:true};
}
function showReps(n){
  showBig(n,'REPS'); const nt=repNote(n);
  if(nt) $('big').insertAdjacentHTML('beforeend',`<span class="note${nt.beat?' beat':''}">${nt.t}</span>`);
}
function verdict(w,r){
  const L=sess.last; if(!L) return {t:''};
  const reps=n=>`${n} ${n===1?'rep':'reps'}`;
  if(w>L.w) return {t:`Up ${+(w-L.w).toFixed(2)} kg on last time (${fmtW(L.w)} × ${L.r}).`,up:true};
  if(w<L.w) return {t:`Last time: ${fmtW(L.w)} × ${L.r}.`};
  if(r>L.r) return {t:`Up ${reps(r-L.r)} on last time.`,up:true};
  return r===L.r?{t:'Same as last time.'}:{t:`${reps(L.r-r)} short of last time (${L.r}).`};
}
function showBig(v,label){$('big').innerHTML=v===''?'':`${v}${label?`<small>${label}</small>`:''}`;if(v!==''&&label!=='REST')replay($('big'),'pop');}
function hud(){
  const ex=curEx(); if(!ex) return;
  $('hudEx').textContent=LIB[ex.key].name;
  $('hudSet').textContent=`Set ${sess.si+1} of ${ex.sets}, ${fmtW(ex.weight)}`;
  const ls=lastSets(ex.key); sess.last=(ls&&ls[sess.si])||null;
}
function pickMime(){
  const c=['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];
  return c.find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported(m))||'';
}
$('startBtn').onclick=async()=>{
  $('homeMsg').textContent='';
  if(!curWorkout()) return;
  if(!plan.length){$('homeMsg').textContent='Add at least one exercise.';return;}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){$('homeMsg').textContent='Camera is not available. Open this page over https (or localhost).';return;}
  beep(1,1); // unlock audio on this tap
  try{await startCamera();}catch(e){$('homeMsg').textContent='Camera access was blocked: '+e.message;return;}
  sess={date:Date.now(),idx:sel,name:curWorkout().name,plan:plan.filter(p=>p.sets>0).map(p=>({...p})),ei:0,si:0,sets:[]};
  show('session'); loopOn=true; loop(); toReady(true);
  try{wake=await navigator.wakeLock.request('screen');}catch(e){}
  if(!poseReady) setStatus('Loading rep counter…');
  loadPose();
};
$('flipBtn').onclick=async()=>{if(phase==='rec')return;facing=facing==='user'?'environment':'user';try{await startCamera();}catch(e){}};
$('quitBtn').onclick=()=>{
  if(phase==='rec'||phase==='cd') return;
  const n=sess.sets.length;
  $('quitMsg').textContent=(n?`Your ${n} saved ${n===1?'set is':'sets are'} kept.`:'No sets are saved yet.')+(phase==='confirm'?' The set you just recorded is not saved.':'');
  $('quitSheet').hidden=false;
};
$('quitNo').onclick=()=>{$('quitSheet').hidden=true;};
$('quitYes').onclick=()=>{$('quitSheet').hidden=true;finish();};
function setPh(p){phase=p;$('session').dataset.phase=p;replay($('panelBody'),'swap');}

function toReady(newExercise){
  setPh('ready'); clearInterval(timer); hud(); showBig('');
  $('recdot').style.display='none';
  const ex=curEx();
  $('panelBody').innerHTML=`${newExercise?`<div class="lbl">${LIB[ex.key].gap?'Face the camera':'Stand side-on to the camera'}</div>`:''}
    ${sess.last?`<div class="lastbox"><span>Set ${sess.si+1} last time</span><b>${fmtW(sess.last.w)} × ${sess.last.r}</b></div>`:''}
    <button class="pri big" id="goBtn">Start set ${sess.si+1}</button>`;
  $('goBtn').onclick=countdown;
}
function countdown(){
  setPh('cd'); let n=settings.cd; $('panelBody').innerHTML='<button class="big" id="cxBtn">Cancel</button>';
  $('cxBtn').onclick=()=>{clearInterval(timer);toReady(false);};
  setStatus(''); showBig(n); beep(660);
  timer=setInterval(()=>{n--; if(n>0){showBig(n);beep(660);}else{clearInterval(timer);startSet();}},1000);
}
function startSet(){
  const ex=curEx(), L=LIB[ex.key];
  counter=new SetTracker(L); chunks=[];
  const mime=pickMime();
  try{
    recorder=new MediaRecorder(stream,mime?{mimeType:mime,videoBitsPerSecond:4e6}:undefined);
    recorder.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};
    recorder.start(1000);
  }catch(e){recorder=null;}
  recT0=performance.now(); setPh('rec'); beep(1320,300); buzz(200);
  $('recdot').style.display='flex'; showReps(0);
  setStatus(poseReady?'':'Rep counter unavailable');
  $('panelBody').innerHTML='<button class="red big" id="endBtn">End set</button>';
  $('endBtn').onclick=()=>endSet(false);
}
function endSet(auto){
  if(phase!=='rec') return;
  setPh('confirm'); $('recdot').style.display='none'; beep(520,250); buzz([80,60,80]);
  const reps=counter.reps.slice(), dur=(performance.now()-recT0)/1000, ex=curEx();
  const done=blob=>confirmSet({reps,dur,blob,auto});
  if(recorder&&recorder.state!=='inactive'){
    const type=recorder.mimeType||'video/webm';
    recorder.onstop=()=>done(new Blob(chunks,{type}));
    recorder.stop();
  }else done(null);
}
function confirmSet(rec){
  const ex=curEx(); let r=rec.reps.length, w=ex.weight;
  showBig(''); setStatus(rec.auto?'Ended automatically':'');
  $('panelBody').innerHTML=`
    <div class="row"><div class="grow"><div class="lbl">Reps</div><div class="step"><button id="rm">−</button><b id="rv"></b><button id="rp">+</button></div></div>
    <div class="grow"><div class="lbl">Weight (kg)</div><div class="step"><button id="wm">−</button><b id="wv"></b><button id="wp">+</button></div></div></div>
    <div id="verdict"></div>
    <label class="row" style="margin:10px 2px;font-size:14px"><input type="checkbox" id="warm" style="width:auto"> Warm-up set</label>
    <div class="row"><button class="big" id="redo" style="flex:1">Discard</button><button class="pri big" id="save" style="flex:2">Save set</button></div>`;
  const paint=()=>{$('rv').textContent=r;$('wv').textContent=w;const v=verdict(w,r);$('verdict').textContent=v.t;$('verdict').classList.toggle('up',!!v.up);}; paint();
  $('rm').onclick=()=>{r=Math.max(0,r-1);paint();}; $('rp').onclick=()=>{r++;paint();};
  $('wm').onclick=()=>{w=Math.max(0,w-2.5);paint();}; $('wp').onclick=()=>{w+=2.5;paint();};
  $('redo').onclick=()=>toReady(false);
  $('save').onclick=()=>{
    ex.weight=w;
    sess.sets.push({key:ex.key,name:LIB[ex.key].name,set:sess.si+1,w,r,warm:$('warm').checked,reps:rec.reps,dur:rec.dur,blob:rec.blob});
    const pl=plan.find(p=>p.key===ex.key); if(pl){pl.weight=w;saveRoutine();}
    let newEx=false;
    if(sess.si+1<ex.sets) sess.si++; else{sess.ei++;sess.si=0;newEx=true;}
    if(!curEx()) return finish();
    rest(ex.rest,newEx);
  };
}
function rest(sec,newEx){
  setPh('rest'); hud(); let end=Date.now()+sec*1000;
  const L=sess.last;
  setStatus(newEx?`Next: ${LIB[curEx().key].name}`:(L?`Last time: ${fmtW(L.w)} × ${L.r}`:''));
  $('panelBody').innerHTML='<div class="row"><button class="big" id="more" style="flex:1">+30s</button><button class="pri big" id="skip" style="flex:2">Skip rest</button></div>';
  $('more').onclick=()=>{end+=30000;tick();};
  const over=()=>{clearInterval(timer);toReady(newEx);};
  $('skip').onclick=over;
  const tick=()=>{
    const left=Math.ceil((end-Date.now())/1000);
    if(left<=0){beep(880,200);setTimeout(()=>beep(1175,350),220);buzz([200,100,200,100,400]);over();return;}
    showBig(`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`,'REST');
  };
  clearInterval(timer); if(sec<=0) return over(); tick(); timer=setInterval(tick,250);
}
function finish(){
  clearInterval(timer); setPh('idle'); loopOn=false;
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
  try{wake&&wake.release();}catch(e){}
  const byEx=[]; for(const s of sess.sets){let g=byEx.find(x=>x.key===s.key);if(!g){g={key:s.key,name:s.name,sets:[]};byEx.push(g);}g.sets.push(s);}
  if(sess.sets.length){
    const h=store.get('rc_history',[]);
    h.unshift({date:sess.date,day:sess.name,ex:byEx.map(g=>({key:g.key,name:g.name,sets:g.sets.map(s=>({w:s.w,r:s.r}))}))});
    store.set('rc_history',h.slice(0,50));
    completeDay(sess.idx);
  }
  const vol=sess.sets.filter(s=>!s.warm).reduce((a,s)=>a+s.w*s.r,0);
  $('sumTitle').textContent=`${sess.name} done`;
  $('sumSub').textContent=sess.sets.length?`${sess.sets.length} ${sess.sets.length===1?'set':'sets'}, ${Math.round(vol)} kg total volume`:'No sets were saved.';
  $('sumBody').innerHTML=byEx.map(g=>`<div class="card"><div class="exname" style="margin-bottom:6px">${g.name}</div><table>${g.sets.map(s=>{
    const i=sess.sets.indexOf(s); const ext=s.blob&&s.blob.type.includes('mp4')?'mp4':'webm';
    return `<tr><td>Set ${s.set}${s.warm?' (warm-up)':''}</td><td><b>${fmtW(s.w)} × ${s.r}</b></td><td class="r">${s.blob?`<a href="${URL.createObjectURL(s.blob)}" download="${s.key}-set${s.set}.${ext}">Download clip</a>`:'no clip'}</td></tr>`;}).join('')}</table></div>`).join('');
  renderReelOpts(); $('reelOut').innerHTML=''; $('reelBtn').disabled=!sess.sets.some(s=>s.blob&&!s.warm); $('reelBtn').textContent='Build highlight reel';
  show('summary'); renderPlan(); renderHistory();
}
$('homeBtn').onclick=()=>show('home');

/* ---------- AUTO-EDIT (highlight reel) ---------- */
const once=(el,ev,ms=6000)=>new Promise((res,rej)=>{const to=setTimeout(()=>rej(new Error(ev+' timeout')),ms);el.addEventListener(ev,()=>{clearTimeout(to);res();},{once:true});});
function renderReelOpts(){
  const o=settings.reel, secs=o.mode==='secs', n=v=>`${v} ${v===1?'rep':'reps'}`;
  const seg=(key,opts)=>`<div class="seg">${opts.map(([v,l])=>`<button data-seg="${key}" data-v="${v}" aria-pressed="${o[key]===v}"${o[key]===v?' class="on"':''}>${l}</button>`).join('')}</div>`;
  $('reelOpts').innerHTML=seg('mode',[['reps','By reps'],['secs','By seconds']])
    +(secs?stepper('Start of set','secFirst',o.secFirst?o.secFirst+' s':'None','r')+stepper('End of set','secLast',o.secLast?o.secLast+' s':'None','r')
          :stepper('Start of set','first',o.first?n(o.first):'None','r')+stepper('End of set','last',o.last?n(o.last):'None','r'))
    +seg('sets',[['best','Best set'],['all','Every set']]);
}
$('reelOpts').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return; const o=settings.reel, d=b.dataset;
  if(d.seg) o[d.seg]=d.v;
  if(d.f){
    bump(o,d.f,+d.d); lastBump={i:'r',f:d.f};
    // the reel needs something from each set: never let both ends reach zero
    const [x,y]=o.mode==='secs'?['secFirst','secLast']:['first','last'];
    if(!o[x]&&!o[y]) o[d.f]=1;
  }
  store.set('rc_settings',settings); renderReelOpts(); lastBump=null;
});
function topSets(){
  if(settings.reel.sets==='all') return sess.sets.filter(s=>s.blob&&!s.warm);
  const out=[]; const seen=new Set();
  for(const s of sess.sets){ if(seen.has(s.key)) continue; seen.add(s.key);
    const c=sess.sets.filter(x=>x.key===s.key&&x.blob&&!x.warm);
    if(c.length) out.push(c.reduce((a,b)=>(b.w>a.w||(b.w===a.w&&b.r>a.r))?b:a));
  }
  return out;
}
function drawFrame(ctx,c,v){
  const sc=Math.max(c.width/v.videoWidth,c.height/v.videoHeight), dw=v.videoWidth*sc, dh=v.videoHeight*sc;
  ctx.drawImage(v,(c.width-dw)/2,(c.height-dh)/2,dw,dh);
}
$('reelBtn').onclick=async()=>{
  const picks=topSets(), btn=$('reelBtn'); if(!picks.length) return;
  btn.disabled=true; $('reelOut').innerHTML='';
  const v=document.createElement('video'); v.muted=true; v.playsInline=true; v.preload='auto';
  const c=document.createElement('canvas'), ctx=c.getContext('2d'); let rec=null, parts=[];
  try{
    for(const [i,s] of picks.entries()){
      btn.textContent=`Rendering ${i+1}/${picks.length}: ${s.name}…`;
      v.src=URL.createObjectURL(s.blob); await once(v,'loadedmetadata');
      if(!rec){
        c.width=v.videoWidth||720; c.height=v.videoHeight||1280;
        const mime=pickMime(); rec=new MediaRecorder(c.captureStream(30),mime?{mimeType:mime,videoBitsPerSecond:5e6}:undefined);
        rec.ondataavailable=e=>{if(e.data&&e.data.size)parts.push(e.data);}; rec.start(500);
      }
      for(const seg of reelSegments(s,settings.reel)){
        const b=Math.min(seg.b,s.dur||seg.b);
        const sk=once(v,'seeked'); v.currentTime=seg.a; await sk.catch(()=>{});
        await v.play();
        const wall=performance.now()+(b-seg.a+3)*1000;
        await new Promise(res=>{const tick=()=>{
          drawFrame(ctx,c,v);
          if(v.currentTime>=b||v.ended||performance.now()>wall){v.pause();res();}else requestAnimationFrame(tick);};tick();});
      }
    }
    const stopped=new Promise(r=>rec.onstop=r); rec.stop(); await stopped;
    const blob=new Blob(parts,{type:rec.mimeType||'video/webm'}), url=URL.createObjectURL(blob), ext=blob.type.includes('mp4')?'mp4':'webm';
    $('reelOut').innerHTML=`<video src="${url}" controls playsinline></video><p><a href="${url}" download="workout-reel.${ext}">Download reel</a></p>`;
    btn.textContent='Rebuild highlight reel';
  }catch(e){
    console.error(e); $('reelOut').innerHTML=`<p class="warn">Could not build the reel on this browser (${e.message}). The individual clips above still work.</p>`;
    btn.textContent='Try again';
  }
  btn.disabled=false;
};

/* ---------- OPENING SCREEN ---------- */
(function(){
  const sp=$('splash'), t0=performance.now(); if(!sp) return;
  const hide=()=>setTimeout(()=>{
    sp.classList.add('out');
    const tc=document.querySelector('meta[name="theme-color"]'); if(tc) tc.content='#ECEEE9';
    setTimeout(()=>sp.remove(),500);
  },Math.max(0,900-(performance.now()-t0)));
  // wait for the fonts (2 s at most) so the home screen doesn't shift after it appears
  const fonts=document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve();
  Promise.race([fonts,new Promise(r=>setTimeout(r,2000))]).then(hide,hide);
})();

/* ---------- OFFLINE COPY ---------- */
const CDN_HOSTS=['cdn.jsdelivr.net','storage.googleapis.com','fonts.googleapis.com','fonts.gstatic.com'];
// Hand the service worker the list of model and font files this page loaded, so it saves them
async function saveForOffline(){
  try{
    const reg=await navigator.serviceWorker.ready;
    const urls=[...new Set(performance.getEntriesByType('resource').map(e=>e.name))].filter(u=>{try{return CDN_HOSTS.includes(new URL(u).hostname);}catch(e){return false;}});
    if(reg.active&&urls.length) reg.active.postMessage({type:'cache',urls});
  }catch(e){}
}
async function offlineStatus(){
  let ok=false;
  try{
    if(navigator.serviceWorker&&navigator.serviceWorker.controller&&window.caches&&await caches.has('repcam-shell-'+APP_VERSION)){
      const keys=await (await caches.open('repcam-runtime')).keys();
      ok=keys.some(r=>r.url.endsWith('.task'))&&keys.some(r=>r.url.endsWith('.wasm'));
    }
  }catch(e){}
  $('ver').textContent=`Version ${APP_VERSION.slice(1)}. `+(ok?'Saved on this phone, works offline.':'Not saved for offline use yet.');
  return ok;
}
offlineStatus();
if('serviceWorker' in navigator) window.addEventListener('load',async()=>{
  try{await navigator.serviceWorker.register('./sw.js');}catch(e){}
  for(let i=0;i<40;i++){ if(i%3===1) saveForOffline(); if(await offlineStatus()) break; await new Promise(r=>setTimeout(r,3000)); }
});
</script>
